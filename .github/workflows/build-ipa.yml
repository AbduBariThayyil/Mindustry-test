name: Build Mindustry iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Mindustry v159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Resolve the Arc commit Mindustry was built against
        id: arc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(grep '^archash=' Mindustry/gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          full=$(gh api "repos/Anuken/Arc/commits/$short" --jq .sha)
          echo "hash=$full" >> "$GITHUB_OUTPUT"

      - name: Checkout matching Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          ref: ${{ steps.arc.outputs.hash }}
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install C++ Tools & Compile Arc Natives
        run: |
          echo "Installing Mac compilation tools..."
          brew install ant autoconf automake libtool pkg-config
          
          echo "Compiling C++ engine core..."
          cd Arc
          chmod +x ./gradlew
          ./gradlew jnigen jnigenBuildAllIOS

      - name: Move Natives & Inject MetalANGLEKit
        run: |
          echo "1. Finding and copying freshly compiled C++ static libraries..."
          mkdir -p Mindustry/ios/libs
          
          # Scan the entire Arc directory to ensure we catch the output files
          find Arc -type f -name "libarc.a" -exec cp {} Mindustry/ios/libs/libarc.a \;
          find Arc -type f -name "libarc-freetype.a" -exec cp {} Mindustry/ios/libs/libarc-freetype.a \;
          
          echo "Verifying copied natives:"
          ls -la Mindustry/ios/libs/
          
          echo "2. Downloading and extracting MetalANGLEKit..."
          mkdir -p Mindustry/ios/frameworks
          curl -L -o metal.zip https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          unzip -q -o metal.zip -d Mindustry/ios/frameworks/
          
          echo "3. Linking framework path safely in robovm.xml..."
          awk '/<\/config>/{print "  <frameworkPaths>\n    <path>frameworks</path>\n  </frameworkPaths>\n</config>"; next}1' Mindustry/ios/robovm.xml > tmp.xml && mv tmp.xml Mindustry/ios/robovm.xml

      - name: Patch iOS Build Script (Surgical)
        run: |
          echo "Hunting down and destroying fake <framework>arc</framework> in all XMLs..."
          find . -name "robovm.xml" -type f -exec sed -i '' '/<framework>arc<\/framework>/d' {} +
          
          echo "Removing string framework references from build.gradle..."
          find . -name "build.gradle" -type f -exec sed -i '' "s/'arc', //g" {} +
          find . -name "build.gradle" -type f -exec sed -i '' "s/, 'arc'//g" {} +
          find . -name "build.gradle" -type f -exec sed -i '' "s/\"arc\", //g" {} +
          find . -name "build.gradle" -type f -exec sed -i '' "s/, \"arc\"//g" {} +
          
          echo "Explicitly loading the compiled real C++ natives into RoboVM..."
          sed -i '' 's|<lib>z</lib>|<lib>z</lib><lib>libs/libarc.a</lib><lib>libs/libarc-freetype.a</lib>|g' Mindustry/ios/robovm.xml
          
          echo "Allowing unsigned builds..."
          sed -i '' 's/iosSkipSigning = false/iosSkipSigning = true/' Mindustry/ios/build.gradle
          
          echo "Bypassing Gradle 9 duplicate copy crash..."
          echo "tasks.withType(Copy).configureEach { duplicatesStrategy = DuplicatesStrategy.INCLUDE }" >> Mindustry/ios/build.gradle

      - name: Build the IPA
        working-directory: Mindustry
        run: |
          chmod +x ./gradlew
          ./gradlew pack
          ./gradlew ios:deploy -Pbuildversion=159.7 --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-159.7-ios
          path: Mindustry/ios/build/robovm/*.ipa
