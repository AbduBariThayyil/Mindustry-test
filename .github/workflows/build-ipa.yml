name: Build Mindustry iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Mindustry v159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Resolve the Arc commit Mindustry was built against
        id: arc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(grep '^archash=' Mindustry/gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "short hash: $short"
          full=$(gh api "repos/Anuken/Arc/commits/$short" --jq .sha)
          echo "full sha: $full"
          echo "hash=$full" >> "$GITHUB_OUTPUT"

      - name: Checkout matching Arc (must sit next to Mindustry)
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          ref: ${{ steps.arc.outputs.hash }}
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Inject Arc Natives & MetalANGLEKit
        run: |
          echo "1. Fetching precompiled Arc static libraries natively into Arc structure..."
          mkdir -p Arc/natives/natives-ios/libs
          mkdir -p Arc/natives/natives-freetype-ios/libs
          
          curl -L -o Arc/natives/natives-ios/libs/libarc.a https://github.com/Anuken/Arc/raw/master/natives/natives-ios/libs/libarc.a
          curl -L -o Arc/natives/natives-freetype-ios/libs/libarc-freetype.a https://github.com/Anuken/Arc/raw/master/natives/natives-freetype-ios/libs/libarc-freetype.a
          
          echo "2. Downloading and extracting MetalANGLEKit..."
          mkdir -p Mindustry/ios/frameworks
          curl -L -o metal.zip https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          unzip -q -o metal.zip -d Mindustry/ios/frameworks/
          
          echo "3. Linking framework path safely in robovm.xml..."
          awk '/<\/config>/{print "  <frameworkPaths>\n    <path>frameworks</path>\n  </frameworkPaths>"}1' Mindustry/ios/robovm.xml > tmp.xml && mv tmp.xml Mindustry/ios/robovm.xml

      - name: Patch iOS Build Script
        working-directory: Mindustry
        run: |
          echo "Removing false dynamic framework 'arc' from build.gradle..."
          sed -i '' "s/\"arc\"//g" ios/build.gradle
          sed -i '' "s/'arc'//g" ios/build.gradle
          
          echo "Allowing unsigned builds..."
          sed -i '' 's/iosSkipSigning = false/iosSkipSigning = true/' ios/build.gradle

      - name: Build the IPA
        working-directory: Mindustry
        run: |
          chmod +x ./gradlew
          ./gradlew pack
          ./gradlew ios:deploy -Pbuildversion=159.7 --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-159.7-ios
          path: Mindustry/ios/build/robovm/*.ipa
