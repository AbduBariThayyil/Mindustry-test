name: Build Mindustry iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout Mindustry v159.7
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: v159.7
          path: Mindustry

      - name: Resolve the Arc commit Mindustry was built against
        id: arc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(grep '^archash=' Mindustry/gradle.properties | cut -d'=' -f2 | tr -d '\r\n')
          full=$(gh api "repos/Anuken/Arc/commits/$short" --jq .sha)
          echo "hash=$full" >> "$GITHUB_OUTPUT"

      - name: Checkout matching Arc
        uses: actions/checkout@v4
        with:
          repository: Anuken/Arc
          ref: ${{ steps.arc.outputs.hash }}
          path: Arc

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install C++ Tools & Compile Arc Natives
        run: |
          echo "Installing Mac compilation tools..."
          brew install ant autoconf automake libtool pkg-config
          
          echo "Compiling C++ engine core (ignoring 32-bit failures)..."
          cd Arc
          chmod +x ./gradlew
          
          # Run the build but catch the error when Xcode inevitably refuses to build 32-bit
          ./gradlew jnigen jnigenBuildAllIOS || echo "Ignored expected compilation error on 32-bit iOS."
          
          echo "Locating built 64-bit static libraries..."
          mkdir -p arc-core/libs/ios64 arc-core/libs/ios32
          mkdir -p extensions/freetype/libs/ios64 extensions/freetype/libs/ios32
          
          # Strictly find the 64-bit libraries
          CORE_A=$(find . -path "*/ios64/*" -name "libarc.a" | head -n 1)
          if [ -n "$CORE_A" ]; then
            echo "Rescuing 64-bit core: $CORE_A"
            cp "$CORE_A" arc-core/libs/ios64/libarc.a
          else
            echo "CRITICAL ERROR: Core libarc.a not found!"
            exit 1
          fi
          
          FREE_A=$(find . -path "*/ios64/*" -name "libarc-freetype.a" | head -n 1)
          if [ -n "$FREE_A" ]; then
            echo "Rescuing 64-bit freetype: $FREE_A"
            cp "$FREE_A" extensions/freetype/libs/ios64/libarc-freetype.a
          else
            echo "CRITICAL ERROR: Freetype libarc-freetype.a not found!"
            exit 1
          fi
          
          echo "Creating dummy 32-bit files to satisfy Mindustry copyNatives task..."
          touch arc-core/libs/ios32/libarc.a
          touch extensions/freetype/libs/ios32/libarc-freetype.a

      - name: Download MetalANGLEKit & Prepare Mindustry
        run: |
          echo "Downloading and extracting MetalANGLEKit..."
          mkdir -p Mindustry/ios/frameworks
          curl -L -o metal.zip https://github.com/libgdx/MetalANGLEKit/releases/download/v1.2.1/metalanglekit.zip
          unzip -q -o metal.zip -d Mindustry/ios/frameworks/
          
          echo "Linking framework path safely in robovm.xml..."
          awk '/<\/config>/{print "  <frameworkPaths>\n    <path>frameworks</path>\n  </frameworkPaths>\n</config>"; next}1' Mindustry/ios/robovm.xml > tmp.xml && mv tmp.xml Mindustry/ios/robovm.xml

      - name: Patch iOS Build Script (Surgical)
        run: |
          echo "Removing fake arc framework..."
          find . -name "robovm.xml" -type f -exec sed -i '' '/<framework>arc<\/framework>/d' {} +
          
          find . -name "build.gradle" -type f -exec sed -i '' "s/'arc', //g" {} +
          find . -name "build.gradle" -type f -exec sed -i '' "s/, 'arc'//g" {} +
          find . -name "build.gradle" -type f -exec sed -i '' "s/\"arc\", //g" {} +
          find . -name "build.gradle" -type f -exec sed -i '' "s/, \"arc\"//g" {} +
          
          echo "Explicitly loading the compiled 64-bit C++ natives into RoboVM..."
          sed -i '' 's|<lib>z</lib>|<lib>z</lib><lib>libs/ios64/libarc.a</lib><lib>libs/ios64/libarc-freetype.a</lib>|g' Mindustry/ios/robovm.xml
          
          echo "Allowing unsigned builds..."
          sed -i '' 's/iosSkipSigning = false/iosSkipSigning = true/' Mindustry/ios/build.gradle
          
          echo "Bypassing Gradle 9 duplicate copy crash..."
          echo "tasks.withType(Copy).configureEach { duplicatesStrategy = DuplicatesStrategy.INCLUDE }" >> Mindustry/ios/build.gradle

      - name: Build the IPA
        working-directory: Mindustry
        run: |
          chmod +x ./gradlew
          ./gradlew pack
          ./gradlew ios:deploy -Pbuildversion=159.7 --stacktrace

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-159.7-ios
          path: Mindustry/ios/build/robovm/*.ipa
